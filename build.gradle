plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    // Local copies of the jars installed in the Simply NeoForged instance (not committed, see libs/README.md).
    implementation files('libs/complicated_bees-neoforge-3.6.2+26.1.2-port.2.jar')
    // Thaumaturge is optional at runtime (phase 2 thaumic bees load behind neoforge:mod_loaded); the dev server runs with it.
    compileOnly files('libs/thaumaturge-26.1.2-NeoForge-1.1.0.jar')
    runtimeOnly files('libs/thaumaturge-26.1.2-NeoForge-1.1.0.jar')
    // Curios is optional: the Bee Ring and the magnet's necklace slot register only when it is loaded.
    compileOnly files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    runtimeOnly files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    runtimeOnly files('libs/lithostitched-1.8.1-neoforge-26.1.jar')
    // Ars Magica Legacy is optional: its bees, combs and flowers load behind neoforge:mod_loaded "arsmagicalegacy".
    compileOnly files('libs/arsmagicalegacy-26.1.2-1.7.1.jar')
    runtimeOnly files('libs/arsmagicalegacy-26.1.2-1.7.1.jar')
    runtimeOnly files('libs/geckolib-neoforge-26.1.2-5.5.2.jar')
    runtimeOnly files('libs/patchouli-neoforge-26.1-94.jar')
    // Neo Vitae is optional: the blood frames register only when it is loaded.
    compileOnly files('libs/neovitae-26.1.2-1.1.49.jar')
    runtimeOnly files('libs/neovitae-26.1.2-1.1.49.jar')
    runtimeOnly files('libs/modonomicon-26.1.2-neoforge-2.20.0.jar')
    // JEI is optional: compat/jei/MBJeiPlugin only loads when JEI finds it.
    compileOnly files('libs/jei-26.1.2-common-api-29.47.0.111.jar')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            jvmArgument '-Xmx3G'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'magicbees.selftest', 'true'
            jvmArgument '-Xmx2G'
        }
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version              : minecraft_version,
            minecraft_version_range        : minecraft_version_range,
            neo_version                    : neo_version,
            mod_id                         : mod_id,
            mod_name                       : mod_name,
            mod_license                    : mod_license,
            mod_version                    : mod_version,
            complicated_bees_version_range : complicated_bees_version_range,
            thaumaturge_version_range      : thaumaturge_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
